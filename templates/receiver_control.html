<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Receiver Control Unit</title>
    <style>
        body { background: #050a10; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 40px; }
        .container { max-width: 1000px; margin: auto; background: #101820; padding: 30px; border-radius: 20px; border: 1px solid #1a2a3a; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .gallery { display: flex; gap: 20px; margin-bottom: 30px; min-height: 350px; }
        .card { flex: 1; background: #000; padding: 20px; border-radius: 12px; border: 1px solid #333; display: flex; flex-direction: column; justify-content: space-between; }
        .card p { font-size: 11px; color: #d400ff; text-transform: uppercase; margin-bottom: 15px; letter-spacing: 1px; }
        img { width: 100%; border-radius: 8px; min-height: 250px; max-height: 400px; object-fit: contain; background: #0a0a0a; border: 1px solid #1a2a3a; }

        .btn-group { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 20px; align-items: center; }
        .btn { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.3s; font-size: 11px; text-decoration: none; display: flex; align-items: center; justify-content: center; min-height: 45px; }

        .btn-dec { background: #d400ff; color: white; }
        .btn-dec:hover { filter: brightness(1.2); box-shadow: 0 0 15px rgba(212, 0, 255, 0.4); }

        .btn-save { background: #00ffcc; color: #050a10; display: none; }
        .btn-save:hover { background: #02d4aa; }

        .btn-brute { background: transparent; border: 1px solid #ff0044; color: #ff0044; }
        .btn-brute:hover { background: #ff0044; color: white; }

        .btn-dash { background: #00d4ff; color: #050a10; }
        .btn-dash:hover { background: #00b8e6; box-shadow: 0 0 15px rgba(0, 212, 255, 0.4); }

        .btn-ana { background: #00ffaa; color: #050a10; }
        .btn-ana:hover { background: #00cc88; box-shadow: 0 0 15px rgba(0, 255, 170, 0.3); }

        #bruteModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 1000; }
        .console-box { width: 550px; background: #000; padding: 25px; border: 2px solid #ff0044; border-radius: 10px; }
        #consoleText { height: 300px; overflow-y: auto; text-align: left; font-family: 'Courier New', monospace; color: #0f0; font-size: 13px; margin-bottom: 20px; padding: 10px; background: #050505; border: 1px solid #222; }
        .placeholder-box { min-height: 250px; display: flex; align-items: center; justify-content: center; background: #0a0a0a; border: 1px dashed #d400ff; color: #d400ff; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: #d400ff; letter-spacing: 2px;">🛡 RECEIVER CONTROL TERMINAL</h2>

        <div class="gallery">
            <div class="card">
                <p>[ Ciphertext Input - Status ]</p>
                <div class="placeholder-box" style="border: none; padding: 0; position: relative;">
                    <img src="/static/uploads/{{ preview }}" alt="Encrypted Stream">
                    <div style="position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 5px 12px; border-radius: 5px; font-size: 10px; color: #d400ff; border: 1px solid #d400ff;">
                        STATUS: ENCRYPTED STREAM
                    </div>
                </div>
            </div>

            <div id="dec_card" class="card" style="display:none;">
                <p style="color:#00ffcc;">[ Successfully Decrypted Image ]</p>
                <img id="dec_img" alt="Decrypted Result">
            </div>
        </div>

        <div class="btn-group">
            <button onclick="executeDecryption()" class="btn btn-dec">Execute Decryption</button>

            <button onclick="runAnalysisAndRedirect()" class="btn btn-ana">🔍 Integrity Analysis</button>

            <button id="downloadBtn" onclick="downloadImage()" class="btn btn-save">Save Image</button>

            <button onclick="showBruteForce()" class="btn btn-brute">Test RSA Vulnerability</button>

            <a href="/dashboard" target="_blank" class="btn btn-dash">🛡️ Full Dashboard</a>
        </div>

        <br>
        <a href="/" style="color:#555; text-decoration:none; display:inline-block; margin-top:30px; font-size: 13px;">← Back to Main Portal</a>
    </div>

    <div id="bruteModal">
        <div class="console-box">
            <h3 style="color:#ff0044; margin-top:0; letter-spacing: 1px;">BRUTE FORCE ATTACK SIMULATION</h3>
            <div id="consoleText"></div>
            <button onclick="document.getElementById('bruteModal').style.display='none'" style="background:#222; color:white; border:1px solid #444; padding:12px; width:100%; cursor:pointer; font-weight: bold; border-radius: 5px;">CLOSE TERMINAL</button>
        </div>
    </div>

    <script>
    // دالة فك التشفير
    async function executeDecryption() {
        const btn = document.querySelector('.btn-dec');
        try {
            const fileName = "{{ enc_file }}";
            const userKey = `{{ key | safe }}`.trim();

            btn.innerText = "Processing...";
            btn.disabled = true;

            const resp = await fetch('/decrypt_action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ file: fileName, key: userKey })
            });

            const data = await resp.json();

            if (resp.ok && data.dec_file) {
                const b64Image = "data:image/png;base64," + data.dec_file;
                document.getElementById('dec_img').src = b64Image;
                document.getElementById('dec_card').style.display = "flex";
                document.getElementById('downloadBtn').style.display = "flex";

                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            } else {
                alert("Error: " + (data.error || "Decryption failed"));
            }
        } catch (error) {
            alert("Connection error!");
        } finally {
            btn.innerText = "Execute Decryption";
            btn.disabled = false;
        }
    }

    // دالة التحليل الإحصائي
    function runAnalysisAndRedirect() {
        fetch('/receiver_analysis_action', { method: 'POST' })
        .then(response => response.json())
        .then(data => {
            if(data.status === 'success') {
                window.location.href = '/receiver_analysis_page';
            } else {
                alert("Error: Please make sure the image is decrypted first.");
            }
        });
    }

    // دالة الحفظ
    function downloadImage() {
        const img = document.getElementById('dec_img');
        if (!img.src) return;
        const link = document.createElement('a');
        link.href = img.src;
        link.download = "Decrypted_Result.png";
        link.click();
    }

    // دالة هجوم RSA
    function showBruteForce() {
        const modal = document.getElementById('bruteModal');
        const con = document.getElementById('consoleText');
        modal.style.display = 'flex';
        con.innerHTML = "Initializing RSA-2048 Attack Sequence...<br><br>";
        let i = 0;
        const timer = setInterval(() => {
            const hexKey = Math.random().toString(16).substr(2, 12).toUpperCase();
            con.innerHTML += `<span style="color:#555;">[TRY]</span> ${hexKey}... <span style="color:#ff0044">FAILED</span><br>`;
            con.scrollTop = con.scrollHeight;
            if (++i > 20) {
                clearInterval(timer);
                con.innerHTML += "<br><b style='color:#ff0044'>[SYSTEM] ATTACK TERMINATED: ENTROPY STABILITY DETECTED.</b>";
            }
        }, 80);
    }
    </script>
</body>
</html>
