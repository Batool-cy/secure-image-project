<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Statistical Analysis</title>
    <style>
        body { background: #050a10; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 40px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 900px; margin: 40px auto; }
        .stat-card { background: #101820; border: 1px solid #00d4ff; padding: 25px; border-radius: 15px; box-shadow: 0 0 15px rgba(0,212,255,0.2); }
        .stat-value { font-size: 32px; color: #00ffaa; font-weight: bold; display: block; font-family: 'Courier New', monospace; }
        .stat-label { font-size: 12px; color: #8899a6; text-transform: uppercase; }
        .charts { display: flex; gap: 20px; justify-content: center; margin-top: 30px; }
        .chart-box { background: #000; padding: 15px; border-radius: 10px; border: 1px solid #1a2a3a; flex: 1; max-width: 450px; }
        img { width: 100%; border-radius: 5px; }
        .btn-back { display: inline-block; margin-top: 40px; color: #00d4ff; text-decoration: none; border: 1px solid #00d4ff; padding: 10px 25px; border-radius: 5px; transition: 0.3s; }
        .btn-back:hover { background: rgba(0,212,255,0.1); }
    </style>
</head>
<body>
    <h1 style="color:#00d4ff;">📊 SECURITY ANALYSIS METRICS</h1>

    <div class="stats-grid">
    <div class="stat-card">
        <span class="stat-label">Information Entropy</span>
        <span class="stat-value">{{ enc_entropy }}</span>
    </div>
    <div class="stat-card">
        <span class="stat-label">NPCR (Sensitivity)</span>
        <span class="stat-value">{{ enc_npcr }}%</span>
    </div>
    <div class="stat-card">
        <span class="stat-label">UACI (Differential)</span>
        <span class="stat-value">{{ enc_uaci }}%</span>
    </div>
</div>

    <div class="charts">
        <div class="chart-box">
            <p class="stat-label">Original Histogram</p>
            <img src="/static/uploads/{{ h_orig }}?t={{ range(1,999)|random }}">
        </div>
        <div class="chart-box">
            <p class="stat-label">Encrypted Histogram</p>
            <img src="/static/uploads/{{ h_enc }}?t={{ range(1,999)|random }}">
        </div>
    </div>

    <a href="/sender_panel" class="btn-back">← Return to Sender Panel</a>
</body>
</html>
