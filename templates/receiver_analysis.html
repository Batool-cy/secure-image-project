<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Decryption Analysis</title>
    <style>
        body { background: #050a10; color: white; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 1100px; margin: auto; }
        .header { text-align: center; color: #00d4ff; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 2px; }

        .stats-row { display: flex; gap: 20px; margin-bottom: 30px; }
        .stat-card { flex: 1; background: #0a1118; border: 1px solid #1a2a3a; padding: 25px; border-radius: 15px; text-align: center; box-shadow: 0 0 15px rgba(0,212,255,0.1); }
        .stat-card small { color: #8899a6; display: block; margin-bottom: 10px; font-size: 12px; font-weight: bold; }
        .stat-card .val { color: #00ffaa; font-size: 32px; font-weight: bold; font-family: 'Courier New', monospace; }

        .visual-row { display: flex; gap: 20px; }
        .visual-card { flex: 1; background: #0a1118; padding: 20px; border-radius: 15px; border: 1px solid #1a2a3a; text-align: center; }
        .visual-card img { width: 100%; height: 300px; object-fit: contain; border-radius: 10px; background: #000; margin-top: 15px; }

        .btn-back { display: inline-block; margin-top: 30px; padding: 12px 35px; border: 1px solid #00d4ff; color: #00d4ff; text-decoration: none; border-radius: 5px; transition: 0.3s; }
        .btn-back:hover { background: rgba(0,212,255,0.1); box-shadow: 0 0 15px #00d4ff; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="header">📊 DECRYPTION INTEGRITY METRICS</h1>

        <div class="stats-row">
            <div class="stat-card">
                <small>INFORMATION ENTROPY (RESTORED)</small>
                <span class="val">{{ dec_entropy }}</span>
            </div>
            <div class="stat-card">
                <small>NPCR (INTEGRITY MATCH)</small>
                <span class="val">{{ dec_npcr }}%</span>
            </div>
            <div class="stat-card">
                <small>UACI (PIXEL FIDELITY)</small>
                <span class="val">{{ dec_uaci }}%</span>
            </div>
        </div>

        <div class="visual-row">

            <div class="visual-card">
                <small style="color:#00ffaa">DECRYPTED RESULT</small>
                <img src="{{ url_for('static', filename='uploads/' + dec_img) }}">
            </div>
        </div>

       <center>
    <a href="javascript:history.back()" class="btn-back">← RETURN TO DECRYPTION PANEL</a>
</center>
    </div>
</body>
</html>
